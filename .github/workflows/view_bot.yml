name: YouTube View Booster

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=d2Wg5jdK5jE'
      views:
        description: 'Number of views to boost'
        required: true
        default: '10'
      watch_time:
        description: 'Watch duration per view (seconds)'
        required: true
        default: '35'
      threads:
        description: 'Concurrent Browser Threads (Multi-IP)'
        required: false
        default: '3'
      telegram_chat_id:
        description: 'Optional Telegram Chat ID override'
        required: false
        default: ''

  repository_dispatch:
    types: [boost_views]

jobs:
  boost-views:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tor Service (Stream Isolation Multi-IP)
        run: |
          sudo apt-get update
          sudo apt-get install -y tor curl
          # Configure Tor with Stream Isolation (different IP per SOCKS auth user)
          # Exclude heavily abused / blacklisted hosting subnets (Austria EDIS, Czechia, etc.)
          sudo bash -c 'cat <<EOF > /etc/tor/torrc
          SocksPort 9050 IsolateSOCKSAuth
          ControlPort 9051
          CookieAuthentication 0
          ExcludeExitNodes {at},{cz},{ru},{by},{ir}
          StrictNodes 0
          NewCircuitPeriod 15
          MaxCircuitDirtiness 30
          EOF'
          sudo systemctl restart tor
          sleep 4
          # Verify Tor is operational
          curl --socks5-hostname 127.0.0.1:9050 https://api.ipify.org && echo ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Execute Multi-Threaded View Booster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || github.event.client_payload.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET_URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url || '' }}"
          TARGET_VIEWS="${{ github.event.inputs.views || github.event.client_payload.views || '10' }}"
          TARGET_TIME="${{ github.event.inputs.watch_time || github.event.client_payload.watch_time || '3' }}"
          TARGET_THREADS="${{ github.event.inputs.threads || github.event.client_payload.threads || '3' }}"

          echo "Target URL: $TARGET_URL"
          echo "Views: $TARGET_VIEWS"
          echo "Watch Time: $TARGET_TIME"
          echo "Threads: $TARGET_THREADS"

          python core_bot.py \
            --url "$TARGET_URL" \
            --views "$TARGET_VIEWS" \
            --watch-time "$TARGET_TIME" \
            --threads "$TARGET_THREADS"

      - name: Upload Bot Stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-stats
          path: bot_stats.json
